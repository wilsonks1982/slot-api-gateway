management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: info, health, metrics, prometheus

jwt:
  secret: ${JWT_SECRET}
  issuer: slot-auth-service


logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.loadbalancer: INFO
    org.springframework.web.servlet.function: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] [%X{userId}] [%X{type}] [%X{role}]  %-5level [%logger{0}] - %msg%n"
